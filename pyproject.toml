[project]
name = "speech-service"
version = "1.0.0"
description = "Vietnamese speech service: STT via Gemini transcribe API, TTS via local VieNeu"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.20",
    "vieneu==3.8.3",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "sherpa-onnx>=1.13.0",
    "sherpa-onnx-core>=1.13.0",
    "huggingface-hub>=0.24.0,<1.0",
    "tokenizers<=0.23.0",
    "onnxruntime>=1.24.3",
]

[project.optional-dependencies]
# PyTorch backend for VieNeu on an NVIDIA GPU (TTS_DEVICE=cuda)
cuda = ["vieneu[cuda]==3.8.3"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
